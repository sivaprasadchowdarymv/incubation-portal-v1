# Incubation Phase 1 RAG Agent — full stack
#   docker compose up -d --build                                  -> app + email worker + local AI (Ollama)
#   docker compose --profile quick-tunnel up -d                   -> + free temporary public https URL (trycloudflare.com)
#   docker compose --profile named-tunnel up -d                   -> + permanent public URL on your own domain (Cloudflare Tunnel)
# Settings come from the .env file next to this file.
name: incubation

services:
  ollama:                                   # local AI engine; models are stored in the "ollama" volume
    image: ollama/ollama:latest
    restart: unless-stopped
    volumes:
      - ollama:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 30

  ollama-init:                              # one-time model download (skipped quickly when already present)
    image: ollama/ollama:latest
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      OLLAMA_HOST: http://ollama:11434
    entrypoint: ["/bin/sh", "-c", "ollama pull ${OLLAMA_CHAT_MODEL:-mistral} && ollama pull ${OLLAMA_EMBED_MODEL:-nomic-embed-text}"]
    restart: "no"

  app:                                      # web portal
    build:
      context: .
      dockerfile: docker/app.Dockerfile
    image: incubation-rag:latest
    restart: unless-stopped
    env_file: .env
    environment:
      OLLAMA_BASE_URL: http://ollama:11434
    command: ["app"]
    volumes:
      - storage:/app/storage                # database, uploads, templates, search index
      - kb:/app/kb                          # knowledge-base documents (incl. ones uploaded in the app)
    ports:
      - "127.0.0.1:8501:8501"               # this computer only; the public URL goes through the tunnel
    depends_on:
      ollama-init:
        condition: service_completed_successfully

  worker:                                   # email reminders, delivery and retries
    image: incubation-rag:latest
    restart: unless-stopped
    env_file: .env
    environment:
      OLLAMA_BASE_URL: http://ollama:11434
    command: ["worker"]
    volumes:
      - storage:/app/storage
      - kb:/app/kb
    depends_on:
      app:
        condition: service_healthy

  tunnel-quick:                             # free temporary URL, changes on every restart (testing/demos)
    image: cloudflare/cloudflared:latest
    profiles: ["quick-tunnel"]
    restart: unless-stopped
    command: ["tunnel", "--no-autoupdate", "--url", "http://app:8501"]
    depends_on:
      app:
        condition: service_healthy

  tunnel-named:                             # permanent URL on your domain; needs CLOUDFLARE_TUNNEL_TOKEN in .env
    image: cloudflare/cloudflared:latest
    profiles: ["named-tunnel"]
    restart: unless-stopped
    command: ["tunnel", "--no-autoupdate", "run"]
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:-}
    depends_on:
      app:
        condition: service_healthy

volumes:
  storage:
  kb:
  ollama:
